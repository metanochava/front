<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
  </head>
  <body >
    <!-- quasar:entry-point -->
    <div id="loading-screen">
      <div class="loader-container">
        <!-- the host EntityType's icon (see the script below), small loader under it -->
        <img id="splash-icon" class="splash-icon" alt="" />
        <div class="spinner"></div>
      </div>
      <!-- the maker's mark at the foot of the splash, like "from Meta" -->
      <div class="splash-from">
        <span class="splash-from__label">from</span>
        <span class="splash-from__brand">MytecH</span>
      </div>
    </div>
    <script>
      // Splash icon: the icon of this host's EntityType (saude.example.com ->
      // "saude", on an IP the first path segment - same rule as quasar_resaas
      // utils/entityTypeHost.js), read from the PUBLIC EntityType catalogue and
      // remembered per host so the next opening shows it at once. Hosts with no
      // EntityType (client sites) show the app icon.
      (function () {
        var img = document.getElementById('splash-icon')
        if (!img) return
        var FALLBACK = 'icons/favicon-128x128.png'
        var host = location.hostname
        var isIp = /^\d{1,3}(\.\d{1,3}){3}$/.test(host) || host.indexOf(':') !== -1
        var parts = host.split('.')
        var key = (isIp ? (location.pathname.split('/').filter(Boolean)[0] || '') : (parts[0] === 'www' ? parts[1] : parts[0]) || '').toLowerCase()
        var cacheKey = 'splashIcon:' + key
        function show (src) {
          img.onload = function () { img.classList.add('splash-icon--ready') }
          img.onerror = function () { if (img.src.indexOf(FALLBACK) === -1) img.src = FALLBACK }
          img.src = src
        }
        var cached = null
        try { cached = localStorage.getItem(cacheKey) } catch (e) {}
        show(cached || FALLBACK)
        if (!key) return
        fetch('<%= splashApi %>/django_resaas/entitytypes/?format=json')
          .then(function (r) { return r.ok ? r.json() : [] })
          .then(function (data) {
            var rows = Array.isArray(data) ? data : (data && data.results) || []
            var type = rows.find(function (t) { return String(t && t.name || '').toLowerCase() === key })
            var src = type && type.icon && type.icon.url
            try { src ? localStorage.setItem(cacheKey, src) : localStorage.removeItem(cacheKey) } catch (e) {}
            if (src && src !== cached) show(src)
          })
          .catch(function () {})
      })()
    </script>
  </body>

  <style>
    #loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #f5f7fa, #c7d8ecff);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.4s ease-in-out;
    }

    .loader-container {
      text-align: center;
    }

    .splash-icon {
      display: block;
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin: 0 auto 20px;
      border-radius: 22px;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    .splash-icon--ready {
      opacity: 1;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(6, 107, 209, 0.25);
      border-top: 3px solid #1976d2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }


    .splash-from {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .splash-from__label {
      font-size: 13px;
      color: #6b7280;
    }

    .splash-from__brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #111827;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0.4;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</html>
